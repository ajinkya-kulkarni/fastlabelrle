[build-system]
requires = ["setuptools>=77", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastlabelrle"
version = "0.0.1"
description = "Fast direct COCO RLE encoding for integer instance-label images"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["numpy>=2.0"]

[project.urls]
Repository = "https://github.com/ajinkya-kulkarni/fastlabelrle"
Issues = "https://github.com/ajinkya-kulkarni/fastlabelrle/issues"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "setuptools>=77",
]
benchmark = [
    "hotcoco",
    "pycocotools",
    "rpycocotools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
